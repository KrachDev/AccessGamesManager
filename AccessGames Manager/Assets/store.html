<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AccessGames — المتجر</title>
  <meta name="description" content="ألعاب PC و PS5 و Xbox بالدرهم المغربي. تفعيل، فاميلي شير، أو كي كامل.">
  <style>
/* ═══════════════════════════════════════════════════════════
   AccessGames — Design System v4  "Arcade Underground"
   Fonts: Bebas Neue (display) + Noto Kufi Arabic (body) + JetBrains Mono
   Vibe: Moroccan gaming den. Neon on black. CRT pulse. Alive.
   ═══════════════════════════════════════════════════════════ */

/* @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Kufi+Arabic:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap'); */

:root {
  /* ── Palette ── */
  --bg-0:        #0d1117;
  --bg-1:        #131924;
  --bg-2:        #1a2235;
  --bg-3:        #212c42;
  --border:      rgba(255,255,255,0.09);
  --border-lit:  rgba(24,212,255,0.28);

  /* Neon blue — primary energy */
  --neon:        #18d4ff;
  --neon-dim:    #00a8d4;
  --neon-glow:   rgba(24,212,255,0.32);
  --neon-subtle: rgba(24,212,255,0.10);

  /* Neon gold — secondary accent */
  --gold:        #ffd84d;
  --gold-dim:    #c9a720;
  --gold-glow:   rgba(255,216,77,0.28);
  --gold-subtle: rgba(255,216,77,0.08);

  --text-1: #f0f5ff;
  --text-2: #8896b3;
  --text-3: #4a556e;

  --green:  #00e5a0;
  --red:    #ff4f6a;
  --amber:  #f59e0b;
  --blue:   #18d4ff;

  /* ── Type ── */
  --font-ar:      'Segoe UI', Arial, sans-serif;
  --font-display: 'Arial Black', 'Trebuchet MS', sans-serif;
  --font-mono:    'Courier New', 'Consolas', monospace;

  /* ── Radius — rounder everywhere ── */
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 30px;

  /* ── Transition ── */
  --t-fast: 120ms ease;
  --t-base: 210ms ease;
  --t-slow: 360ms cubic-bezier(.4,0,.2,1);
}

/* ─── Reset ───────────────────────────────────── */
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  font-family: var(--font-ar);
  background: var(--bg-0);
  color: var(--text-1);
  line-height: 1.75;
  direction: rtl;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Atmospheric grid background ── */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(24,212,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(24,212,255,0.035) 1px, transparent 1px);
  background-size: 52px 52px;
  pointer-events:none;
  z-index:0;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 0%, black 30%, transparent 100%);
}

/* ── Neon bloom blobs ── */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 65% 55% at 15% -5%, rgba(24,212,255,0.13) 0%, transparent 60%),
    radial-gradient(ellipse 45% 45% at 85% 100%, rgba(255,216,77,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 35% 35% at 50% 55%, rgba(0,120,200,0.07) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}

a { color:var(--neon); text-decoration:none; }
a:hover { color:var(--text-1); }

/* ─── Layout ──────────────────────────────────── */
.container {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 28px;
  position: relative;
  z-index: 1;
}
.page-wrapper { min-height:100vh; display:flex; flex-direction:column; }
.page-content { flex:1; padding:56px 0; }

/* ─── Navbar ──────────────────────────────────── */
.navbar {
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(32px) saturate(200%);
  border-bottom: 1px solid rgba(24,212,255,0.08);
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}

/* top neon accent line */
.navbar::before {
  content:'';
  position:absolute;
  top:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--neon) 50%, transparent);
  opacity:0.45;
  pointer-events:none;
}

/* subtle bottom glow */
.navbar::after {
  content:'';
  position:absolute;
  bottom:0; left:8%; right:8%; height:1px;
  background: linear-gradient(90deg, transparent, rgba(0,200,255,0.1), transparent);
  pointer-events:none;
}

.navbar .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 62px;
}

/* ── Brand ── */
.navbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 1.4rem;
  letter-spacing: 0.12em;
  color: var(--text-1);
  text-decoration: none;
  flex-shrink: 0;
  transition: color var(--t-fast);
}
.navbar-brand:hover { color: var(--neon); }

/* logo image — used on ALL pages */
.navbar-logo-img {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: var(--r-sm);
  flex-shrink: 0;
  filter: drop-shadow(0 0 6px rgba(0,200,255,0.3));
  transition: filter var(--t-base), transform var(--t-base);
}
.navbar-brand:hover .navbar-logo-img {
  filter: drop-shadow(0 0 16px rgba(0,200,255,0.85));
  transform: scale(1.06);
}

/* fallback div (legacy) */
.logo-mark {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #00c8ff, #005580);
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; color: var(--bg-0); font-weight: 800;
  font-family: var(--font-display); letter-spacing:0.05em;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(0,200,255,0.4);
}

/* ── Links ── */
.navbar-links {
  display: flex;
  align-items: stretch;
  list-style: none;
  height: 62px;
}
.navbar-links li {
  display: flex;
  align-items: center;
}
.navbar-links a {
  color: var(--text-2);
  padding: 0 12px;
  height: 100%;
  display: flex; align-items: center;
  font-size: 0.83rem;
  font-weight: 700;
  white-space: nowrap;
  font-family: var(--font-ar);
  text-decoration: none;
  position: relative;
  transition: color var(--t-fast);
}

/* neon underline on hover / active */
.navbar-links a:not(.btn)::after {
  content: '';
  position: absolute;
  bottom: 0; left: 10px; right: 10px;
  height: 2px;
  background: var(--neon);
  border-radius: 2px 2px 0 0;
  box-shadow: 0 0 8px rgba(0,200,255,0.6);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 150ms ease;
}
.navbar-links a:not(.btn):hover        { color: var(--text-1); }
.navbar-links a:not(.btn):hover::after { transform: scaleX(1); }
.navbar-links a.active                 { color: var(--neon); }
.navbar-links a.active::after          { transform: scaleX(1); }

/* account btn */
.navbar-links li:last-child { padding-right: 0; margin-right: 4px; align-items: center; }

/* ── Hamburger ── */
.menu-toggle {
  display: none;
  background: none;
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-2);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 7px 11px;
  border-radius: var(--r-sm);
  transition: border-color var(--t-fast), color var(--t-fast);
}
.menu-toggle:hover { border-color: rgba(0,200,255,0.4); color: var(--neon); }

/* ─── Buttons ─────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 26px;
  border: none;
  border-radius: 100px;
  font-family: var(--font-ar);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--t-base);
  position: relative;
  white-space: nowrap;
  overflow: hidden;
}

/* Shimmer sweep on hover */
.btn::after {
  content:'';
  position:absolute;
  inset:0;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
  transform: translateX(-120%);
  transition: transform 0.5s ease;
}
.btn:hover::after { transform: translateX(120%); }

.btn-primary {
  background: linear-gradient(135deg, #18d4ff 0%, #0090cc 100%);
  color: #07111a;
  font-weight: 800;
  box-shadow: 0 4px 28px rgba(24,212,255,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #4de0ff, #18bfe0);
  box-shadow: 0 6px 40px rgba(24,212,255,0.6);
  transform: translateY(-2px);
}

.btn-secondary {
  background: var(--bg-2);
  color: var(--text-1);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: rgba(0,200,255,0.3); background: var(--bg-3); }

.btn-success { background: var(--green); color: var(--bg-0); font-weight:800; }
.btn-success:hover { filter: brightness(1.1); transform: translateY(-1px); }

.btn-danger { background: var(--red); color: #fff; font-weight:800; }
.btn-danger:hover { filter: brightness(1.1); transform: translateY(-1px); }

.btn-ghost {
  background: transparent;
  color: var(--text-2);
  border: 1px solid rgba(255,255,255,0.1);
}
.btn-ghost:hover { color: var(--neon); border-color: rgba(0,200,255,0.4); background: var(--neon-subtle); }

.btn-sm { padding: 6px 16px; font-size: 0.82rem; border-radius: 100px; }
.btn-lg { padding: 14px 36px; font-size: 1.05rem; }
.btn:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; }

/* ─── Cards ───────────────────────────────────── */
.card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 28px;
  transition: var(--t-base);
}
.card-glow {
  box-shadow: 0 0 0 1px rgba(0,200,255,0.06), 0 20px 60px rgba(0,0,0,0.5);
}
.card-hover:hover {
  border-color: rgba(0,200,255,0.2);
  transform: translateY(-3px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,200,255,0.1);
}

/* ─── Forms ───────────────────────────────────── */
.form-group { margin-bottom: 22px; }

.form-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-3);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
}

.form-input, .form-select {
  width: 100%;
  padding: 12px 18px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  color: var(--text-1);
  font-family: var(--font-ar);
  font-size: 0.95rem;
  transition: var(--t-fast);
  outline: none;
}
.form-input:focus, .form-select:focus {
  border-color: rgba(24,212,255,0.55);
  box-shadow: 0 0 0 4px rgba(24,212,255,0.12);
}
.form-input::placeholder { color: var(--text-3); }

/* File upload */
.file-upload {
  border: 2px dashed rgba(0,200,255,0.18);
  border-radius: var(--r-lg);
  padding: 36px 20px;
  text-align: center;
  cursor: pointer;
  transition: var(--t-base);
  position: relative;
}
.file-upload:hover, .file-upload.dragover {
  border-color: rgba(0,200,255,0.5);
  background: var(--neon-subtle);
}
.file-upload input[type="file"] {
  position:absolute; inset:0; opacity:0; cursor:pointer;
}
.file-upload-icon { font-size:2.2rem; margin-bottom:10px; }
.file-upload-text { color:var(--text-2); font-size:0.92rem; }

.file-preview { margin-top:16px; display:none; }
.file-preview img { max-width:180px; max-height:140px; border-radius:var(--r-sm); border:1px solid var(--border); }
.file-preview.active { display:block; }

/* ─── Badges ──────────────────────────────────── */
.badge {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:100px;
  font-size:0.75rem; font-weight:700; letter-spacing:0.04em;
}
.badge-pending    { background:rgba(245,158,11,0.1); color:var(--amber); border:1px solid rgba(245,158,11,0.2); }
.badge-queued,
.badge-verified   { background:rgba(0,200,255,0.08); color:var(--neon); border:1px solid rgba(0,200,255,0.2); }
.badge-activating { background:rgba(0,200,255,0.06); color:var(--neon); border:1px solid rgba(0,200,255,0.2); animation:pulse-badge 1.8s ease infinite; }
.badge-done       { background:rgba(0,229,160,0.08); color:var(--green); border:1px solid rgba(0,229,160,0.2); }
.badge-rejected   { background:rgba(255,79,106,0.1); color:var(--red); border:1px solid rgba(255,79,106,0.2); }

/* ─── Payment Info Box ────────────────────────── */
.payment-box {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 20px 22px;
}
.payment-box-gold { border-color: rgba(0,200,255,0.2); background: rgba(0,200,255,0.03); }
.payment-box-amber { border-color: rgba(245,158,11,0.18); background: rgba(245,158,11,0.03); }
.payment-value {
  font-family: var(--font-mono);
  font-size: 1rem;
  color: var(--text-1);
  direction: ltr; text-align: left;
  margin-top: 6px;
  background: var(--bg-0);
  padding: 8px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  display: block;
}

/* ─── Tabs ────────────────────────────────────── */
.tabs {
  display: flex; gap: 4px;
  background: var(--bg-2);
  padding: 5px; border-radius: 100px;
  margin-bottom: 22px;
}
.tab-btn {
  flex:1; padding:9px 18px;
  border:none; background:transparent;
  color:var(--text-2);
  font-family:var(--font-ar); font-size:0.9rem; font-weight:700;
  cursor:pointer; border-radius:100px;
  transition:var(--t-fast);
}
.tab-btn.active {
  background: linear-gradient(135deg, #18d4ff, #005a8c);
  color: #07111a;
  font-weight: 800;
}
.tab-content { display:none; }
.tab-content.active { display:block; animation:fadeIn 0.25s ease; }

/* ─── Accordion ───────────────────────────────── */
.accordion-item {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 6px;
  overflow: hidden;
  transition: border-color var(--t-base);
}
.accordion-item.open { border-color: rgba(0,200,255,0.2); }
.accordion-header {
  width:100%; padding:17px 22px;
  background:var(--bg-1); border:none;
  color:var(--text-1); font-family:var(--font-ar);
  font-size:0.97rem; font-weight:700;
  cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
  transition:var(--t-fast);
  text-align:right;
}
.accordion-header:hover { background:var(--bg-2); color: var(--neon); }
.accordion-arrow { color:var(--text-3); font-size:0.75rem; transition:var(--t-base); flex-shrink:0; margin-right:8px; }
.accordion-item.open .accordion-arrow { transform:rotate(180deg); color:var(--neon); }
.accordion-body { max-height:0; overflow:hidden; transition:max-height var(--t-slow); }
.accordion-item.open .accordion-body { max-height:400px; }
.accordion-body-inner {
  padding:18px 22px;
  color:var(--text-2);
  line-height:1.9;
  border-top:1px solid var(--border);
  font-size:0.93rem;
}

/* ─── Table ───────────────────────────────────── */
.table-wrapper { overflow-x:auto; border-radius:var(--r-lg); border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; }
th {
  background:var(--bg-2); padding:11px 15px;
  text-align:right; font-weight:700;
  font-size:0.78rem; color:var(--text-3);
  text-transform:uppercase; letter-spacing:0.06em;
  white-space:nowrap;
}
td { padding:12px 15px; border-top:1px solid var(--border); font-size:0.88rem; white-space:nowrap; }
tr:hover td { background:rgba(0,200,255,0.02); }

/* ─── Modal ───────────────────────────────────── */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center;
  z-index:1000; opacity:0; pointer-events:none;
  transition:var(--t-base);
}
.modal-overlay.active { opacity:1; pointer-events:all; }
.modal {
  background:var(--bg-1);
  border:1px solid rgba(0,200,255,0.15);
  border-radius:var(--r-xl); padding:36px;
  max-width:480px; width:90%;
  transform:scale(0.92) translateY(16px);
  transition:var(--t-base);
  box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 60px rgba(0,200,255,0.05);
  position:relative;
  overflow:hidden;
}
.modal::before {
  content:'';
  position:absolute;
  top:0; right:0;
  width:120px; height:120px;
  background: radial-gradient(circle at top right, rgba(0,200,255,0.1), transparent 70%);
  pointer-events:none;
}
.modal-overlay.active .modal { transform:scale(1) translateY(0); }
.modal-title { font-size:1.25rem; font-weight:800; margin-bottom:14px; font-family:var(--font-ar); }
.modal-actions { display:flex; gap:10px; margin-top:24px; }

/* ─── Toast ───────────────────────────────────── */
.toast-container {
  position:fixed; top:20px; left:20px;
  z-index:2000; display:flex; flex-direction:column; gap:8px;
}
.toast {
  display:flex; align-items:center; gap:12px;
  padding:13px 18px; border-radius:var(--r-md);
  background:var(--bg-2); border:1px solid var(--border-lit);
  box-shadow:0 12px 40px rgba(0,0,0,0.6);
  animation:slideInLeft 0.3s ease;
  min-width:260px; max-width:340px; font-size:0.88rem;
}
.toast-success { border-right:3px solid var(--green); }
.toast-error   { border-right:3px solid var(--red); }
.toast-info    { border-right:3px solid var(--neon); }

/* ─── Hero ────────────────────────────────────── */
.hero {
  padding: 80px 0 56px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content:'';
  position:absolute;
  inset:0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,200,255,0.016) 3px,
    rgba(0,200,255,0.016) 4px
  );
  pointer-events:none;
  z-index:0;
  animation: scanroll 12s linear infinite;
}

.hero::after {
  content:'';
  position:absolute;
  bottom:-40px; left:50%;
  transform:translateX(-50%);
  width:600px; height:200px;
  background: radial-gradient(ellipse, rgba(0,200,255,0.12) 0%, transparent 70%);
  pointer-events:none;
}

.hero .container { position:relative; z-index:1; }

.hero-gamepad {
  font-size: 4.5rem;
  display: block;
  margin: 0 auto 24px;
  animation: float 3.5s ease-in-out infinite, gpadGlow 3.5s ease-in-out infinite;
  filter: drop-shadow(0 0 18px rgba(0,200,255,0.5));
  position: relative;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,200,255,0.07);
  border: 1px solid rgba(0,200,255,0.2);
  color: var(--neon);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 5px 16px;
  border-radius: 100px;
  margin-bottom: 28px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-family: var(--font-mono);
}

.hero-title {
  font-family: var(--font-ar);
  font-size: clamp(2.4rem, 6vw, 4rem);
  font-weight: 800;
  line-height: 1.12;
  letter-spacing: -0.02em;
  margin-bottom: 22px;
  color: var(--text-1);
}

.hero-title .highlight {
  color: var(--neon);
  position: relative;
  text-shadow: 0 0 50px rgba(0,200,255,0.5), 0 0 100px rgba(0,200,255,0.2);
}

.hero-title .highlight::before,
.hero-title .highlight::after {
  content: attr(data-text);
  position: absolute;
  top: 0; right: 0; left: 0;
  opacity: 0;
}
.hero-title .highlight::before {
  color: #ff4f6a;
  animation: glitch1 5s infinite;
  clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
}
.hero-title .highlight::after {
  color: #00e5a0;
  animation: glitch2 5s infinite;
  clip-path: polygon(0 55%, 100% 55%, 100% 70%, 0 70%);
}

.hero-subtitle {
  font-size: 1.05rem;
  color: var(--text-2);
  max-width: 520px;
  margin: 0 auto 38px;
  line-height: 1.9;
}

.hero-cta-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 48px;
}

/* ─── Stats Bar ───────────────────────────────── */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 0;
  border: 1px solid rgba(0,200,255,0.1);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--bg-1);
  flex-wrap: wrap;
}

.stat-item {
  text-align: center;
  flex: 1;
  min-width: 120px;
  padding: 24px 20px;
  border-left: 1px solid rgba(0,200,255,0.08);
  position: relative;
}
.stat-item:first-child { border-left: none; }

.stat-item::before {
  content:'';
  position:absolute;
  top:0; left:20%; right:20%;
  height:2px;
  background: linear-gradient(90deg, transparent, var(--neon), transparent);
  opacity:0.5;
}

.stat-num {
  font-family: var(--font-display);
  font-size: 2.6rem;
  color: var(--neon);
  line-height: 1;
  display: block;
  letter-spacing: 0.04em;
  text-shadow: 0 0 30px rgba(0,200,255,0.5);
}
.stat-lbl { font-size: 0.78rem; color: var(--text-3); margin-top: 6px; font-weight: 700; text-transform:uppercase; letter-spacing:0.06em; }

/* ─── Section Headings ────────────────────────── */
.section-label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--neon);
  margin-bottom: 10px;
  display: block;
  opacity: 0.8;
}

.section-title {
  font-family: var(--font-ar);
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  text-align: center;
  margin-bottom: 14px;
}

.section-subtitle {
  text-align: center;
  color: var(--text-2);
  margin-bottom: 42px;
  font-size: 1rem;
}

.divider {
  width: 60px; height: 2px;
  background: linear-gradient(90deg, var(--neon), transparent);
  margin: 14px auto;
  border-radius: 2px;
  box-shadow: 0 0 14px rgba(0,200,255,0.5);
}

/* ─── Steps ───────────────────────────────────── */
.steps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
  gap: 1px;
  margin: 40px 0;
  background: rgba(0,200,255,0.05);
  border-radius: var(--r-lg);
  border: 1px solid rgba(0,200,255,0.08);
  overflow: hidden;
}

.step-card {
  background: var(--bg-1);
  padding: 36px 28px;
  position: relative;
  transition: var(--t-base);
  overflow: hidden;
}
.step-card:hover { background: var(--bg-2); }

.step-card::before {
  content:'';
  position:absolute;
  top:0; right:0;
  width:0; height:0;
  border-style:solid;
  border-width:0 36px 36px 0;
  border-color: transparent rgba(0,200,255,0.15) transparent transparent;
  transition: border-width var(--t-base);
}
.step-card:hover::before { border-width: 0 48px 48px 0; border-color: transparent rgba(0,200,255,0.3) transparent transparent; }

.step-num {
  font-family: var(--font-display);
  font-size: 5rem;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: transparent;
  line-height: 1;
  margin-bottom: 16px;
  -webkit-text-stroke: 1px rgba(0,200,255,0.2);
  transition: var(--t-base);
}
.step-card:hover .step-num {
  -webkit-text-stroke: 1px rgba(0,200,255,0.55);
  text-shadow: 0 0 30px rgba(0,200,255,0.2);
}
.step-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 10px; }
.step-desc  { font-size: 0.9rem; color: var(--text-2); line-height:1.8; }

/* ─── Trust Banner ────────────────────────────── */
.trust-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 1px;
  background: rgba(0,200,255,0.05);
  border-radius: var(--r-lg);
  border: 1px solid rgba(0,200,255,0.08);
  overflow: hidden;
  margin: 40px 0;
}
.trust-item {
  background: var(--bg-1);
  padding: 28px 22px;
  text-align: center;
  transition: var(--t-base);
  position: relative;
}
.trust-item:hover { background: var(--bg-2); }
.trust-icon {
  font-size:2rem; margin-bottom:12px; display:block;
  filter: drop-shadow(0 0 8px rgba(0,200,255,0.3));
  transition: var(--t-base);
}
.trust-item:hover .trust-icon { filter: drop-shadow(0 0 16px rgba(0,200,255,0.6)); transform: scale(1.1); }
.trust-title { font-size:0.92rem; font-weight:800; margin-bottom:6px; }
.trust-desc  { font-size:0.82rem; color:var(--text-2); line-height:1.65; }

/* ─── Pricing ─────────────────────────────────── */
.pricing-card {
  max-width: 380px;
  margin: 0 auto;
  text-align: center;
  padding: 44px 36px;
  border: 1px solid rgba(0,200,255,0.18);
  position: relative;
  overflow: hidden;
}
.pricing-card::before {
  content:'';
  position:absolute;
  top:-80px; left:50%; transform:translateX(-50%);
  width:320px; height:320px;
  background: radial-gradient(circle, rgba(0,200,255,0.1) 0%, transparent 65%);
  pointer-events:none;
}
.pricing-card::after {
  content:'60';
  font-family: var(--font-display);
  font-size: 12rem;
  font-weight: 400;
  color: rgba(0,200,255,0.03);
  position:absolute;
  bottom:-20px; left:-10px;
  line-height:1;
  pointer-events:none;
  letter-spacing:-0.05em;
}

.pricing-num {
  font-family: var(--font-display);
  font-size: 6rem;
  font-weight: 400;
  color: var(--neon);
  line-height: 1;
  text-shadow: 0 0 50px rgba(0,200,255,0.5);
  letter-spacing: 0.05em;
  position:relative;
}
.pricing-unit { font-size:0.8rem; color: var(--text-2); font-weight: 700; font-family: var(--font-mono); letter-spacing:0.08em; text-transform:uppercase; margin-top:4px; }
.pricing-list {
  list-style: none;
  margin: 28px 0;
  text-align: right;
}
.pricing-list li {
  padding: 10px 0;
  color: var(--text-2);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  font-size: 0.92rem;
}
.pricing-list li:last-child { border-bottom: none; }
.pricing-list li::before { content:'▹'; color:var(--neon); font-weight:800; flex-shrink:0; margin-top:2px; }

/* ─── Status Page ─────────────────────────────── */
.status-card { max-width:520px; margin:0 auto; }
.status-icon { font-size:3.5rem; margin-bottom:14px; display:block; }
.status-title { font-size:1.4rem; font-weight:800; margin-bottom:8px; }
.status-desc  { color:var(--text-2); margin-bottom:22px; }

.timeline { margin-top:28px; }
.timeline-item {
  display:flex; gap:14px; padding:12px 0;
  align-items:flex-start; position:relative;
}
.timeline-item:not(:last-child)::after {
  content:''; position:absolute;
  right:5px; top:28px;
  width:2px; height:calc(100% - 12px);
  background:var(--border);
}
.tl-dot {
  width:12px; height:12px; border-radius:50%;
  border:2px solid var(--border); background:var(--bg-2);
  margin-top:5px; flex-shrink:0;
}
.tl-dot.done   { background:var(--green); border-color:var(--green); box-shadow:0 0 8px rgba(0,229,160,0.4); }
.tl-dot.active { background:var(--neon);  border-color:var(--neon); box-shadow:0 0 12px rgba(0,200,255,0.6); animation:pulse-badge 1.6s ease infinite; }
.tl-label { font-size:0.9rem; font-weight:700; }
.tl-time  { font-size:0.8rem; color:var(--text-3); font-family:var(--font-mono); direction:ltr; }

/* ─── Admin Dashboard ─────────────────────────── */
.dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 14px;
  margin-bottom: 32px;
}
.dash-stat {
  background:var(--bg-1); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:22px;
  text-align:center;
  transition: var(--t-base);
  position:relative; overflow:hidden;
}
.dash-stat::before {
  content:''; position:absolute;
  top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, var(--neon), transparent);
  opacity:0.4;
}
.dash-stat:hover { border-color:rgba(0,200,255,0.2); }
.dash-num {
  font-family:var(--font-display); font-size:2.8rem; font-weight:400;
  color:var(--neon); line-height:1; display:block;
  letter-spacing:0.04em;
  text-shadow:0 0 20px rgba(0,200,255,0.4);
}
.dash-lbl { font-size:0.75rem; color:var(--text-3); margin-top:6px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; font-family:var(--font-mono); }

.filters-bar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
.filter-input {
  padding:8px 16px; background:var(--bg-2);
  border:1px solid var(--border); border-radius:100px;
  color:var(--text-1); font-family:var(--font-ar);
  font-size:0.88rem; outline:none; min-width:160px;
}
.filter-input:focus { border-color:rgba(0,200,255,0.4); }

.actions-cell { display:flex; gap:5px; flex-wrap:wrap; }

.slot-bar {
  width:100%; height:5px;
  background:var(--bg-2); border-radius:3px;
  overflow:hidden; margin-top:8px;
}
.slot-fill {
  height:100%;
  background:linear-gradient(90deg, var(--green), var(--neon));
  border-radius:3px; transition:width var(--t-base);
}

.login-card { max-width:380px; margin:90px auto; text-align:center; }

/* ─── Game Catalogue ──────────────────────────── */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
  gap: 14px;
  margin-top: 36px;
  align-items: start;
}
.game-card {
  background:var(--bg-1); border:1px solid var(--border);
  border-radius:var(--r-lg); overflow:hidden;
  transition:var(--t-base);
  display:flex; flex-direction:column;
  cursor:pointer;
  position:relative;
}
.game-card:hover {
  border-color:rgba(0,200,255,0.3);
  transform:translateY(-6px);
  box-shadow:0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,200,255,0.1), 0 0 30px rgba(0,200,255,0.06);
}

.game-card::before {
  content:'';
  position:absolute;
  inset:0;
  background: linear-gradient(180deg, transparent 60%, rgba(0,200,255,0.12) 100%);
  opacity:0; transition: opacity var(--t-base);
  z-index:1; pointer-events:none;
}
.game-card:hover::before { opacity:1; }

.game-card-img { width:100%; aspect-ratio:3/4; object-fit:cover; background:var(--bg-2); display:block; }
.game-card-placeholder {
  width:100%; aspect-ratio:3/4;
  background:var(--bg-2);
  display:flex; align-items:center; justify-content:center;
  font-size:2.8rem;
}
.game-card-body {
  padding:11px 13px 0;
  display:flex;
  flex-direction:column;
  gap:0;
  position:relative;
  z-index:2;
  flex:1;
}
.game-card-platform-row {
  margin-bottom:5px;
}
.game-card-title {
  font-size:0.83rem;
  font-weight:700;
  line-height:1.35;
  color:var(--text-1);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:6px;
  flex-shrink:0;
}
.game-card-price-row {
  display:flex;
  align-items:baseline;
  gap:6px;
  margin-bottom:7px;
  flex-shrink:0;
}
.game-card-price {
  font-family:var(--font-display);
  font-size:1.25rem;
  font-weight:400;
  color:var(--neon);
  letter-spacing:0.04em;
  text-shadow:0 0 12px rgba(0,200,255,0.4);
  white-space:nowrap;
}
.game-card-steam-price {
  font-size:0.72rem;
  color:var(--text-3);
  text-decoration:line-through;
  font-family:var(--font-mono);
  direction:ltr;
  white-space:nowrap;
}
.game-card-tiers {
  margin-bottom:10px;
  flex-shrink:0;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
.platform-badge { flex-shrink:0; }
.game-card-btn {
  width:100%;
  padding:9px;
  margin-top:auto;
  background: linear-gradient(135deg, #18d4ff, #0080bb);
  color: #07111a;
  border:none;
  border-radius: 0 0 calc(var(--r-lg) - 2px) calc(var(--r-lg) - 2px);
  font-family:var(--font-ar);
  font-weight:800;
  font-size:0.82rem;
  cursor:pointer;
  transition:var(--t-fast);
  display:block;
  flex-shrink:0;
  letter-spacing:0.02em;
}
.game-card-btn:hover { background: linear-gradient(135deg, #4de0ff, #18bfe0); }

.game-picker-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px;
}
.game-picker-item {
  cursor:pointer; border-radius:var(--r-md); overflow:hidden;
  border:2px solid var(--border); transition:var(--t-fast);
}
.game-picker-item:hover { border-color:rgba(0,200,255,0.4); transform:scale(1.03); }
.game-picker-item.selected {
  border-color:var(--neon);
  box-shadow:0 0 0 3px rgba(0,200,255,0.15);
}

/* ─── Footer ──────────────────────────────────── */
.footer {
  text-align:center; padding:36px 0;
  border-top:1px solid rgba(0,200,255,0.08);
  color:var(--text-3); font-size:0.82rem;
  font-family: var(--font-mono);
  position:relative;
}
.footer::before {
  content:'';
  position:absolute;
  top:0; left:20%; right:20%;
  height:1px;
  background: linear-gradient(90deg, transparent, rgba(0,200,255,0.3), transparent);
}

/* ─── Spinner ─────────────────────────────────── */
.spinner {
  width:18px; height:18px;
  border:2px solid rgba(255,255,255,0.15);
  border-top-color: var(--neon);
  border-radius:50%;
  animation:spin 0.55s linear infinite;
  display:inline-block;
}

/* ─── Creds box (admin) ───────────────────────── */
.creds-box {
  background:rgba(0,200,255,0.05); border:1px solid rgba(0,200,255,0.15);
  border-radius:var(--r-md); padding:14px 16px;
  font-family:var(--font-mono); font-size:0.85rem; direction:ltr; text-align:left;
}
.creds-box span { color:var(--text-3); font-family:var(--font-ar); font-size:0.75rem; display:block; margin-bottom:2px; }

/* ─── Utilities ───────────────────────────────── */
.hidden   { display:none !important; }
.flex     { display:flex; }
.flex-wrap{ flex-wrap:wrap; }
.items-center   { align-items:center; }
.justify-between{ justify-content:space-between; }
.text-center{ text-align:center; }
.mt-1{ margin-top:8px; } .mt-2{ margin-top:16px; } .mt-3{ margin-top:24px; } .mt-4{ margin-top:36px; }
.mb-1{ margin-bottom:8px; } .mb-2{ margin-bottom:16px; } .mb-3{ margin-bottom:24px; }
.gap-2{ gap:16px; }

/* ─── Animations ──────────────────────────────── */
@keyframes fadeIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes slideInLeft {
  from { opacity:0; transform:translateX(-28px); }
  to   { opacity:1; transform:translateX(0); }
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse-badge {
  0%,100% { opacity:1; }
  50%     { opacity:0.45; }
}
@keyframes float {
  0%,100% { transform:translateY(0) rotate(-2deg); }
  50%     { transform:translateY(-10px) rotate(2deg); }
}
@keyframes gpadGlow {
  0%,100% { filter: drop-shadow(0 0 14px rgba(0,200,255,0.4)); }
  50%     { filter: drop-shadow(0 0 30px rgba(0,200,255,0.8)) drop-shadow(0 0 60px rgba(0,200,255,0.3)); }
}
@keyframes scanroll {
  from { background-position: 0 0; }
  to   { background-position: 0 100px; }
}
@keyframes glitch1 {
  0%,92%,100% { opacity:0; transform:none; }
  93%  { opacity:0.6; transform:translateX(-3px) skewX(-2deg); }
  95%  { opacity:0; }
  97%  { opacity:0.4; transform:translateX(2px); }
  99%  { opacity:0; }
}
@keyframes glitch2 {
  0%,94%,100% { opacity:0; transform:none; }
  95%  { opacity:0.5; transform:translateX(3px) skewX(2deg); }
  97%  { opacity:0; }
  98%  { opacity:0.3; transform:translateX(-2px); }
  99%  { opacity:0; }
}

.animate-in { animation:fadeIn 0.45s ease both; }
.stagger > *:nth-child(1){ animation-delay:0.04s; }
.stagger > *:nth-child(2){ animation-delay:0.09s; }
.stagger > *:nth-child(3){ animation-delay:0.14s; }
.stagger > *:nth-child(4){ animation-delay:0.19s; }
.stagger > *:nth-child(5){ animation-delay:0.24s; }
.stagger > *:nth-child(6){ animation-delay:0.29s; }
.stagger > *:nth-child(7){ animation-delay:0.34s; }
.stagger > *:nth-child(8){ animation-delay:0.39s; }

/* ─── Responsive ──────────────────────────────── */
@media (max-width: 768px) {
  .navbar-links {
    display:none;
    position:absolute; top:62px; left:0; right:0;
    flex-direction:column;
    background: rgba(8,9,13,0.98);
    backdrop-filter: blur(24px);
    border-bottom:1px solid rgba(0,200,255,0.1);
    padding:6px 0 16px;
    height:auto;
    box-shadow:0 20px 50px rgba(0,0,0,0.7);
  }
  .navbar-links.open  { display:flex; }
  .navbar-links li    { height:auto; width:100%; }
  .navbar-links a     { height:auto; padding:12px 22px; width:100%; }
  .navbar-links a:not(.btn)::after { display:none; }
  .navbar-links a.active { background:rgba(0,200,255,0.06); }
  .navbar-links li:last-child { margin-right:0; padding:8px 14px 0; }
  .navbar-links .btn  { width:100%; justify-content:center; }
  .menu-toggle { display:block; }

  .hero { padding:48px 0 36px; }
  .hero-gamepad { font-size:3.2rem; }
  .steps-grid { grid-template-columns:1fr; gap:1px; }
  .stats-bar { flex-direction:row; }
  .stat-item { border-left: none; border-top: 1px solid rgba(0,200,255,0.08); }
  .stat-item:first-child { border-top: none; }
  .dash-grid { grid-template-columns:repeat(2,1fr); }
  .card { padding:20px; }
  .modal { padding:24px; }
  .modal-actions { flex-direction:column; }
  .game-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
  th,td { padding:9px 12px; font-size:0.82rem; }
}
@media (max-width: 480px) {
  .container { padding:0 16px; }
  .dash-grid { grid-template-columns:1fr; }
  .tabs { flex-direction:column; }
  .hero-title { font-size:2rem; }
  .game-grid { grid-template-columns:repeat(2,1fr); gap:10px; }
  .stats-bar { flex-direction:column; }
  .stat-item { border:none; border-top:1px solid rgba(0,200,255,0.06); }
}

/* Screenshot modal */
.screenshot-modal img { max-width:100%; max-height:70vh; border-radius:var(--r-md); }

/* ─── Page Loader ───────────────────────────────── */
#page-loader-bar {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0;
  z-index: 9999;
  border-radius: 0 2px 2px 0;
  background: linear-gradient(90deg, var(--neon), var(--gold), var(--neon));
  background-size: 200% 100%;
  pointer-events: none;
  transition: opacity 0.4s ease;
  opacity: 0;
}
#page-loader-bar.active        { opacity: 1; }
#page-loader-bar.running       { width: 85%; transition: width 8s cubic-bezier(0.1,0.05,0,1); animation: loaderShimmer 1.4s linear infinite; }
#page-loader-bar.done          { width: 100%; transition: width 0.25s ease; }

@keyframes loaderShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

#page-loader-overlay {
  position: fixed; inset: 0;
  z-index: 9998;
  background: rgba(5,5,7,0.75);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
#page-loader-overlay.active {
  opacity: 1; pointer-events: all;
}

.pl-box {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
}
.pl-logo-img {
  height: 90px;
  width: auto;
  filter: invert(1) drop-shadow(0 0 20px rgba(0,200,255,0.9));
  animation: plPulse 1.2s ease-in-out infinite;
}
@keyframes plPulse {
  0%,100% { opacity: 1;   filter: invert(1) drop-shadow(0 0 16px rgba(0,200,255,0.6)); }
  50%     { opacity: 0.8; filter: invert(1) drop-shadow(0 0 40px rgba(0,200,255,1)) drop-shadow(0 0 80px rgba(0,200,255,0.4)); }
}

.pl-dots {
  display: flex; gap: 8px;
}
.pl-dots span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--neon);
  opacity: 0.2;
  animation: plDot 1.2s ease-in-out infinite;
}
.pl-dots span:nth-child(1) { animation-delay: 0s; }
.pl-dots span:nth-child(2) { animation-delay: 0.2s; }
.pl-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes plDot {
  0%,80%,100% { opacity: 0.15; transform: scale(0.8); }
  40%         { opacity: 1;    transform: scale(1.2); box-shadow: 0 0 10px rgba(0,200,255,0.8); }
}

/* ─── Skeleton Loader ─────────────────────────── */
.skeleton {
  background: var(--bg-2);
  border-radius: var(--r-sm);
  position: relative;
  overflow: hidden;
}
.skeleton::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(0,200,255,0.05) 40%,
    rgba(0,200,255,0.1)  50%,
    rgba(0,200,255,0.05) 60%,
    transparent 100%
  );
  background-size: 200% 100%;
  animation: skeletonSweep 1.6s ease-in-out infinite;
}
@keyframes skeletonSweep {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.skeleton-card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  animation: skeletonFade 1.6s ease-in-out infinite;
}
@keyframes skeletonFade {
  0%,100% { opacity: 1; }
  50%     { opacity: 0.5; }
}
.sk-cover {
  aspect-ratio: 2/3;
  background: linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 100%);
  position: relative; overflow: hidden;
}
.sk-cover::after {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(90deg, transparent, rgba(0,200,255,0.06), transparent);
  background-size:200% 100%;
  animation: skeletonSweep 1.6s ease-in-out infinite;
}
.sk-body  { padding: 14px; }
.sk-line  {
  height: 11px;
  background: var(--bg-3);
  border-radius: 4px;
  margin-bottom: 9px;
  position: relative; overflow: hidden;
}
.sk-line::after {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(90deg, transparent, rgba(0,200,255,0.08), transparent);
  background-size:200% 100%;
  animation: skeletonSweep 1.6s ease-in-out infinite;
}

.sk-line.sk-btn {
  height: 32px;
  margin-top: 12px;
  border-radius: var(--r-sm);
  width: 100% !important;
  opacity: 0.6;
}

.game-card-cover-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: var(--bg-2);
}

.game-card-img-skeleton {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 100%);
}
.game-card-img-skeleton::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(105deg,
    transparent 30%,
    rgba(0,200,255,0.08) 50%,
    transparent 70%
  );
  background-size: 200% 100%;
  animation: skeletonSweep 1.4s ease-in-out infinite;
}

.game-card .game-card-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.game-card .game-card-img.loaded {
  opacity: 1;
}
.game-card .game-card-placeholder {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
  background: var(--bg-2);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Particle Canvas ────────────────────────────── */
#particle-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.7;
}

/* ─── Hero Logo ─────────────────────────────────── */
.hero-logo {
  margin: 0 auto 28px;
  display: flex;
  justify-content: center;
}
.hero-logo-img {
  height: 140px;
  width: auto;
  object-fit: contain;
  animation: float 3.8s ease-in-out infinite, logoGlow 3.8s ease-in-out infinite;
  filter: invert(1) drop-shadow(0 0 24px rgba(0,200,255,0.55));
}
@keyframes logoGlow {
  0%,100% { filter: invert(1) drop-shadow(0 0 16px rgba(0,200,255,0.45)) drop-shadow(0 0 6px rgba(0,200,255,0.2)); }
  50%     { filter: invert(1) drop-shadow(0 0 40px rgba(0,200,255,1))    drop-shadow(0 0 80px rgba(0,200,255,0.4)); }
}

/* ─── Floating WhatsApp Button ──────────────────────── */
.wa-float {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #25D366;
  color: #fff;
  border-radius: 50px;
  padding: 12px 18px 12px 14px;
  box-shadow: 0 4px 24px rgba(37,211,102,0.45), 0 2px 8px rgba(0,0,0,0.3);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.88rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  animation: wa-pop 0.5s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay: 1.2s;
  opacity: 0;
}
.wa-float:hover {
  transform: scale(1.06) translateY(-2px);
  box-shadow: 0 8px 32px rgba(37,211,102,0.6), 0 4px 12px rgba(0,0,0,0.3);
  color: #fff;
  text-decoration: none;
}
.wa-float svg { width: 22px; height: 22px; flex-shrink: 0; }
.wa-float-label { white-space: nowrap; }
@keyframes wa-pop {
  from { opacity: 0; transform: scale(0.5) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@media (max-width: 500px) {
  .wa-float { padding: 12px; border-radius: 50%; }
  .wa-float-label { display: none; }
}

</style>

<style>
  html, body { overflow-y: auto !important; min-height: 100vh; background: transparent !important; }

<body>
<div class="page-wrapper">

  

  <section class="page-content">
    <div class="container">

      <!-- Hero Carousel -->
      <div class="hero-skeleton" id="hero-skeleton"></div>
      <div class="hero-carousel hidden" id="hero-carousel"></div>

      <input type="text" class="search-bar" id="search-input" placeholder="ابحث عن لعبة..." oninput="filterGames()">

        <div class="skeleton-card"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line" style="width:78%"></div><div class="sk-line" style="width:42%"></div><div class="sk-line sk-btn"></div></div></div>
        <div class="skeleton-card"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line" style="width:65%"></div><div class="sk-line" style="width:38%"></div><div class="sk-line sk-btn"></div></div></div>
        <div class="skeleton-card"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line" style="width:82%"></div><div class="sk-line" style="width:50%"></div><div class="sk-line sk-btn"></div></div></div>
        <div class="skeleton-card"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line" style="width:70%"></div><div class="sk-line" style="width:44%"></div><div class="sk-line sk-btn"></div></div></div>
        <div class="skeleton-card"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line" style="width:88%"></div><div class="sk-line" style="width:36%"></div><div class="sk-line sk-btn"></div></div></div>
        <div class="skeleton-card"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line" style="width:60%"></div><div class="sk-line" style="width:48%"></div><div class="sk-line sk-btn"></div></div></div>

<script>
let allGames = [];
let currentPlatform = 'all';
let currentTier = 'all';


window.loadStoreData = function(jsonStr) {
  try {
    const rawOffers = JSON.parse(jsonStr);
    
    allGames = rawOffers.map(o => {
      let platStr = 'pc';
      if (o.Platform === 1) platStr = 'ps5';
      if (o.Platform === 2) platStr = 'xbox';
      
      return {
         gameId: o.Id,
         name: o.Title,
         imageUrl: o.CoverUrl,
         heroUrl: o.CoverUrl,
         platform: platStr,
         is_free: o.Price === 0,
         price: o.Price,
         has_activation: true,
         has_key: false,
         has_family_share: false,
         featured: o.IsHighlighted ? 1 : 0
      };
    });
    
    buildCarousel(allGames);
    document.getElementById('catalogue-loading').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('catalogue-loading').classList.add('hidden');
      document.getElementById('catalogue-grid').classList.remove('hidden');
      renderGames();
    }, 300);
  } catch (e) {
    console.error("Parse error:", e);
    document.getElementById('catalogue-loading').classList.add('hidden');
    document.getElementById('catalogue-empty').classList.remove('hidden');
  }
};


function setPlatform(p, btn) {
  currentPlatform = p;
  document.querySelectorAll('.platform-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderGames();
}

function setTier(t, btn) {
  currentTier = t;
  document.querySelectorAll('.tier-filter').forEach(f => f.classList.remove('active'));
  btn.classList.add('active');
  renderGames();
}

function filterGames() { renderGames(); }

function getLowestPrice(g) {
  if (g.variant_min_price) return g.variant_min_price;
  const prices = [];
  if (g.has_activation && g.price_activation) prices.push(g.price_activation);
  if (g.has_family_share && g.price_family) prices.push(g.price_family);
  if (g.has_key && g.price_key) prices.push(g.price_key);
  if (!prices.length) return g.price || 0;
  return Math.min(...prices);
}

function renderGames() {
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  const grid = document.getElementById('catalogue-grid');
  const empty = document.getElementById('catalogue-empty');

  let filtered = allGames.filter(g => {
    if (currentPlatform !== 'all' && g.platform !== currentPlatform) return false;
    if (currentTier === 'activation' && !g.has_activation) return false;
    if (currentTier === 'family' && !g.has_family_share) return false;
    if (currentTier === 'key' && !g.has_key) return false;
    if (search && !g.name.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('results-count').textContent = filtered.length + ' لعبة';

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  grid.innerHTML = filtered.map((g, i) => {
    const lowestPrice = getLowestPrice(g);
    const priceLabel  = g.is_free ? 'مجاني' : lowestPrice + ' درهم';
    const steamStrike = (!g.is_free && g.steam_price && g.steam_price > lowestPrice)
      ? `<span class="game-card-steam-price">${Math.round(g.steam_price)}د</span>` : '';

    const tiers = [];
    if (g.has_key)          tiers.push(`<span class="tier-badge key">🔑 كي</span>`);
    if (g.has_family_share) tiers.push(`<span class="tier-badge family">📚 مشتركة</span>`);
    if (g.has_activation)   tiers.push(`<span class="tier-badge activation">⚡ أوفلاين</span>`);
    if (g.is_free)          tiers.push(`<span class="tier-badge key">🎁 مجاني</span>`);

    const platformLabel = { pc:'PC', ps5:'PS5', xbox:'Xbox' }[g.platform] || 'PC';

    return `
      <div class="game-card" style="animation:fadeInUp 0.4s ease both;animation-delay:${i*0.05}s"
           onclick="window.chrome.webview.postMessage('offer:' + g.gameId)">
        <div class="game-card-cover-wrap">
          ${g.imageUrl ? `
            <div class="game-card-img-skeleton"></div>
            <img class="game-card-img" src="${g.imageUrl}" alt="${g.name}"
                 onload="this.classList.add('loaded');this.previousElementSibling.style.display='none'"
                 onerror="this.style.display='none';this.previousElementSibling.style.display='none'">
          ` : `<div class="game-card-placeholder">🎮</div>`}
        </div>
        <div class="game-card-body">
          <div class="game-card-platform-row">
            <span class="platform-badge">${platformLabel}</span>
          </div>
          <div class="game-card-title">${g.name}</div>
          <div class="game-card-price-row">
            <span class="game-card-price">${priceLabel}</span>
            ${steamStrike}
          </div>
          <div class="game-card-tiers">${tiers.join('')}</div>
        </div>
        <button class="game-card-btn">اطلب الآن</button>
      </div>`;
  }).join('');
}



// ── Hero Carousel ──
let _heroTimer = null;
let _heroIndex = 0;
let _heroGames = [];

function buildCarousel(games) {
  _heroGames = [...games].sort((a,b) => (b.featured||0)-(a.featured||0)).slice(0, 5);
  if (!_heroGames.length) {
    document.getElementById('hero-skeleton').style.display = 'none';
    return;
  }

  const carousel = document.getElementById('hero-carousel');

  const slides = _heroGames.map((g, i) => {
    const lowestPrice = getLowestPrice(g);
    const priceLabel = g.is_free ? 'مجاني' : lowestPrice + ' درهم';
    const steamPrice = g.steam_price ? `<span>${Math.round(g.steam_price)} MAD</span>` : '';
    const platform = (g.platform || 'pc').toUpperCase();
    return `
      <div class="hero-slide${i===0?' active':''}" data-idx="${i}" onclick="window.chrome.webview.postMessage('offer:' + g.gameId)" style="cursor:pointer;">
        <div class="hero-slide-bg" style="background-image:url('${g.heroUrl || g.imageUrl || ''}')"></div>
        <div class="hero-vignette"></div>
        <div class="hero-vignette-bottom"></div>
        <div class="hero-content">
          <div class="hero-platform-tag">${platform}</div>
          <div class="hero-title">${g.name}</div>
          <div class="hero-price">${steamPrice}${priceLabel}</div>
          <button class="hero-btn" onclick="event.stopPropagation();window.chrome.webview.postMessage('offer:' + g.gameId)">اكتشف ←</button>
        </div>
      </div>`;
  }).join('');

  const dots = _heroGames.map((_, i) =>
    `<button class="hero-dot${i===0?' active':''}" onclick="goSlide(${i})"></button>`
  ).join('');

  carousel.innerHTML = `
    ${slides}
    <button class="hero-arrow prev" onclick="event.stopPropagation();shiftSlide(-1)">›</button>
    <button class="hero-arrow next" onclick="event.stopPropagation();shiftSlide(1)">‹</button>
    <div class="hero-nav">${dots}</div>
  `;

  document.getElementById('hero-skeleton').style.display = 'none';
  carousel.classList.remove('hidden');
  startHeroTimer();
}

function goSlide(idx) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots   = document.querySelectorAll('.hero-dot');
  if (!slides.length) return;
  slides[_heroIndex].classList.remove('active');
  dots[_heroIndex].classList.remove('active');
  _heroIndex = (idx + slides.length) % slides.length;
  slides[_heroIndex].classList.add('active');
  dots[_heroIndex].classList.add('active');
  resetHeroTimer();
}

function shiftSlide(dir) { goSlide(_heroIndex + dir); }

function startHeroTimer() {
  _heroTimer = setInterval(() => goSlide(_heroIndex + 1), 4500);
}

function resetHeroTimer() {
  clearInterval(_heroTimer);
  startHeroTimer();
}
